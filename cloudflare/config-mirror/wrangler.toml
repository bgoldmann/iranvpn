# IranVPN config mirror — Cloudflare Worker
# Deploy: cd cloudflare/config-mirror && npx wrangler deploy
#
# Optional custom domain (recommended):
#   wrangler.toml → routes, or Dashboard → Workers → Custom Domains
#   → https://iranvpn-config.goldmannllc.com

name = "iranvpn-config"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Custom domain on the goldmannllc.com zone (same Cloudflare account).
[[routes]]
pattern = "iranvpn-config.goldmannllc.com"
custom_domain = true

# After first deploy, Workers URL looks like:
#   https://iranvpn-config.<your-subdomain>.workers.dev/server-list.json
# Set that (or your custom domain) in client bootstrap sources.

[vars]
# Upstream when R2 object is missing (GitHub raw).
UPSTREAM_URL = "https://raw.githubusercontent.com/bgoldmann/iranvpn/main/dist-config/server-list.json"

# Uncomment after: wrangler r2 bucket create iranvpn-config
# [[r2_buckets]]
# binding = "CONFIG_BUCKET"
# bucket_name = "iranvpn-config"
